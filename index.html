<body>
<div id="app"></div>
<script>
const seed={
 contestants:[
  ['c1','Arjun Rao','Volt',920,false,false],['c2','Meera Shah','Pulse',860,true,true],['c3','Kabir Khan','Volt',790,true,false],['c4','Riya Nair','Nova',745,false,false],['c5','Dev Malhotra','Pulse',690,true,false],['c6','Anaya Iyer','Nova',640,false,false],['c7','Vihaan Das','Volt',590,true,false],['c8','Tara Menon','Pulse',525,false,false],['c9','Yash Kulkarni','Nova',475,false,false],['c10','Ishita Bose','Volt',430,false,false]
 ].map(([id,name,team,points,nominated,immune])=>({id,name,team,points,nominated,immune,status:'Active',avatar:name.split(' ').map(x=>x[0]).join('')})),
 tasks:[
  {id:'t1',title:'Secret Signal',assignee:'Arjun Rao',due:'Today · 12:30',status:'In Progress',points:100},
  {id:'t2',title:'Kitchen Rotation',assignee:'Tara Menon',due:'Today · 14:00',status:'Complete',points:60},
  {id:'t3',title:'Confession Room Prep',assignee:'Riya Nair',due:'Today · 16:30',status:'Pending',points:80},
  {id:'t4',title:'Garden Reset',assignee:'Anaya Iyer',due:'Tomorrow · 09:00',status:'Pending',points:70}
 ],
 announcements:[{id:1,text:'The next captaincy task begins at 8:00 PM.',time:'09:16'},{id:2,text:'Meera Shah has been granted immunity for this round.',time:'08:58'}],
 captainId:'c2',seconds:900,running:false
};
let state=load() || structuredClone(seed), section='overview', toastTimer;
function load(){try{const s=localStorage.getItem('bb-command-center');return s?JSON.parse(s):null}catch{return null}}
function persist(){localStorage.setItem('bb-command-center',JSON.stringify(state))}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function active(){return state.contestants.filter(c=>c.status==='Active')}
function board(){return active().slice().sort((a,b)=>b.points-a.points)}
function nominees(){return active().filter(c=>c.nominated)}
function captain(){return active().find(c=>c.id===state.captainId)}
function fmt(sec){const m=String(Math.floor(sec/60)).padStart(2,'0');const s=String(sec%60).padStart(2,'0');return m+':'+s}
function navLabel(){return ({overview:'COMMAND CENTER',house:'CONTESTANTS',tasks:'TASKS',danger:'DANGER ZONE',control:'HOUSE CONTROL'})[section]}
function title(){return ({overview:'The House at a glance',house:'Contestant roster',tasks:'Task board',danger:'Nomination & eviction',control:'House control room'})[section]}
function icon(id){return ({overview:'◉',house:'♙',tasks:'▤',danger:'△',control:'⌘'})[id]}
function flash(msg,tone='neutral'){const el=document.createElement('div');el.className='toast '+(tone==='success'?'success':tone==='warn'?'warn':'');el.innerHTML='<span class="dot">'+(tone==='success'?'✓':'!')+'</span>'+esc(msg);document.body.appendChild(el);clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.remove(),2600)}
function setSection(s){section=s;render()}
function changePoints(id,delta){const c=state.contestants.find(x=>x.id===id);if(!c)return;c.points=Math.max(0,c.points+delta);persist();render();flash(c.name+': '+(delta>0?'+':'')+delta+' points.',delta>0?'success':'warn')}
function nomination(id){const c=state.contestants.find(x=>x.id===id);if(!c||c.status!=='Active')return;if(c.immune){flash(c.name+' is immune and cannot be nominated.','warn');return}c.nominated=!c.nominated;persist();render();flash(c.nominated?c.name+' moved to the Danger Zone.':c.name+' removed from nominations.',c.nominated?'warn':'neutral')}
function immunity(id){const c=state.contestants.find(x=>x.id===id);if(!c)return;c.immune=!c.immune;if(c.immune)c.nominated=false;persist();render();flash(c.immune?c.name+' has been granted immunity.':'Immunity removed from '+c.name+'.',c.immune?'success':'neutral')}
function makeCaptain(id){const c=state.contestants.find(x=>x.id===id);if(!c||c.status!=='Active')return;state.captainId=id;persist();render();flash(c.name+' is now the House Captain.','success')}
function evict(id){const c=state.contestants.find(x=>x.id===id);if(!c)return; if(!confirm('Evict '+c.name+' from the House?'))return;c.status='Evicted';c.nominated=false;if(state.captainId===id)state.captainId=null;persist();render();flash(c.name+' has been evicted from the House.','warn')}
function taskToggle(id){const t=state.tasks.find(x=>x.id===id);if(!t)return;const completing=t.status!=='Complete';t.status=completing?'Complete':'Pending';let rewardName='';if(completing&&t.points>0){const c=state.contestants.find(x=>x.name===t.assignee&&x.status==='Active');if(c){c.points+=t.points;rewardName=c.name+' +'+t.points+' points';}}persist();render();flash(completing?(rewardName?'Task complete · '+rewardName+'.':'Task marked complete.'):'Task reopened.',completing?'success':'neutral')}
function broadcast(text){text=text.trim();if(!text)return;state.announcements.unshift({id:Date.now(),text,time:new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})});persist();render();flash('Announcement is live in the House.','success')}
function timerToggle(){state.running=!state.running;persist();render()}
function timerReset(){state.seconds=900;state.running=false;persist();render()}
function timerPreset(s){state.seconds=s;state.running=false;persist();render()}
function resetHouse(){if(!confirm('Restore the prepared demo scenario?'))return;state=structuredClone(seed);persist();render();flash('House restored to demo state.')}
setInterval(()=>{const now=document.querySelector('[data-clock]');if(now)now.textContent=new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});if(state.running&&state.seconds>0){state.seconds--;if(state.seconds===0){state.running=false;persist();render();flash('Task timer finished.','warn')}else{persist();const t=document.querySelector('[data-timer]');if(t)t.textContent=fmt(state.seconds);}}},1000);
function header(){return `<header class="topbar"><div><div class="crumb">CONTROL ROOM / <b>${navLabel()}</b></div><div class="title">${title()}</div></div><div class="top-actions"><div class="dayclock"><small>DAY 41</small><strong data-clock>${new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</strong></div><div class="feed"><span class="bars"><i></i><i></i><i></i><i></i></span> HOUSE FEED STABLE</div></div></header>`}
function shell(){return `<div class="sidebar"><div class="brand"><div class="mark">BB</div><div><div class="micro">TECH HOUSE</div><h1>BIG BOSS</h1></div></div><div class="live"><i></i> LIVE HOUSE FEED</div><nav class="nav">${[['overview','Command Center'],['house','Contestants'],['tasks','Tasks'],['danger','Danger Zone'],['control','House Control']].map(([id,label])=>`<button class="${section===id?'active':''}" onclick="setSection('${id}')"><span class="ico">${icon(id)}</span>${label}</button>`).join('')}</nav><div class="side-bottom"><div class="operator"><div class="opav">BB</div><div><strong>Big Boss</strong><small>Control Room</small></div><span class="pip"></span></div><button class="reset-link" onclick="resetHouse()">Reset demo state</button></div></div><main class="main">${header()}<div id="view"></div></main>`}
function stat(label,value,sub){return `<div class="stat"><label>${label}</label><strong>${value}</strong><small>${sub}</small></div>`}
function avatar(c,cls=''){return `<div class="avatar ${cls}">${esc(c.avatar)}</div>`}
function statusClass(s){return s==='Complete'?'complete':s==='In Progress'?'progress':'pending'}
function taskRows(full=false){return state.tasks.map(t=>`<div class="task ${full?'':'compact'}"><span><strong>${esc(t.title)}</strong><small>${esc(t.id.toUpperCase())} · ${esc(t.due)}</small></span><span>${esc(t.assignee)}</span><span>${esc(t.due)}</span><span class="reward">+${t.points}</span><span><button class="status ${statusClass(t.status)}" onclick="taskToggle('${t.id}')">${t.status==='Complete'?'Completed ✓':t.status}</button></span></div>`).join('')}
function leaderboard(){return board().slice(0,7).map((c,i)=>`<button class="leader" onclick="openDrawer('${c.id}')"><span class="rank ${i===0?'top':''}">${i+1}</span>${avatar(c,'mini')}<span class="name"><strong>${esc(c.name)}</strong><small>${esc(c.team)}${c.id===state.captainId?' · Captain':''}${c.immune?' · Immune':''}</small></span><span class="points">${c.points}</span><span class="trend">${i===0?'TOP':'+'+Math.max(1,8-i*2)}</span></button>`).join('')}
function overview(){const a=active(),b=board(),n=nominees(),cap=captain();return `<div class="stack"><div class="stats">${stat('ACTIVE HOUSE',a.length,'contestants')}${stat('HIGHEST SCORE',b[0]?.points??'—',b[0]?.name||'none')}${stat('TASKS DONE',state.tasks.filter(t=>t.status==='Complete').length,'of '+state.tasks.length)}${stat('DANGER ZONE',n.length,'nominees')}</div><div class="grid2"><section class="panel captain-panel"><div class="head"><div><div class="kicker">THE HOUSE CAPTAIN</div><h3>${cap?esc(cap.name):'No captain assigned'}</h3></div><button class="btn" onclick="setSection('control')">Manage</button></div>${cap?`<div class="captain">${avatar(cap)}<div class="info"><div class="team">${esc(cap.team)} · ${cap.points} POINTS</div><div class="note">Captaincy can be changed instantly from this control room.</div></div><span class="seal">CAPTAIN</span></div>`:`<div class="empty"><strong>—</strong>Assign a captain from House Control.</div>`}</section><section class="panel timer"><div class="head"><div><div class="kicker">TASK TIMER</div><h3>Live countdown</h3></div><span class="state ${state.running?'live':''}">${state.running?'RUNNING':'PAUSED'}</span></div><div class="time" data-timer>${fmt(state.seconds)}</div><div class="actions"><button class="primary" onclick="timerToggle()">${state.running?'Pause':'Start'}</button><button class="btn" onclick="timerReset()">Reset</button></div><div class="presets"><button onclick="timerPreset(300)">05:00</button><button onclick="timerPreset(900)">15:00</button><button onclick="timerPreset(1800)">30:00</button></div></section></div><div class="grid2"><section class="panel"><div class="head"><div><div class="kicker">LIVE LEADERBOARD</div><h3>Who's on top</h3></div><button class="btn" onclick="setSection('house')">View house</button></div><div class="leaders">${leaderboard()}</div></section><section class="panel"><div class="head"><div><div class="kicker">DANGER ZONE</div><h3>Nominees</h3></div><span class="pill">${n.length}</span></div>${n.length?n.map(c=>`<div class="nominee">${avatar(c,'mini')}<div class="ninfo"><strong>${esc(c.name)}</strong><small>${esc(c.team)} · ${c.points} pts</small></div><button class="iconbtn" onclick="evict('${c.id}')" title="Evict">↗</button></div>`).join(''):`<div class="empty"><strong>—</strong>No active nominations.</div>`}<button class="wide" onclick="setSection('danger')">Open nomination board</button></section></div><div class="grid2 wide"><section class="panel"><div class="head"><div><div class="kicker">TASK BOARD</div><h3>Today's duties</h3></div><button class="primary" onclick="openTaskModal()">+ Assign task</button></div><div class="tasks"><div class="task headrow"><span>TASK</span><span>ASSIGNEE</span><span>DUE</span><span>REWARD</span><span>STATUS</span></div>${taskRows()}</div></section><section class="panel"><div class="head"><div><div class="kicker">BIG BOSS ANNOUNCEMENTS</div><h3>Broadcast log</h3></div><button class="btn" onclick="setSection('control')">Broadcast</button></div><div class="announce-input"><input id="announcement" placeholder="Type a message for the House…" onkeydown="if(event.key==='Enter')sendAnnouncement()"><button class="primary" onclick="sendAnnouncement()">Send</button></div><div class="broadcast">${state.announcements.slice(0,4).map(a=>`<div class="item"><time>${esc(a.time)}</time><p>${esc(a.text)}</p></div>`).join('')}</div></section></div><section class="panel quick"><div><div class="kicker">FAST ACTIONS</div><h3>Run the House without leaving the dashboard.</h3></div><div class="quick-actions"><button onclick="setSection('house')">Manage contestants</button><button onclick="setSection('danger')">Open nominations</button><button onclick="setSection('control')">House control</button><button onclick="toggleEvictedView()">Show evicted</button></div></section></div>`}
function house(){const list=window.showEvicted?state.contestants:active();const b=board();return `<div class="stack"><section class="panel intro"><div><div class="kicker">CONTESTANT MANAGEMENT</div><h3>${active().length} active contestants in the House</h3><p>Score, nomination, immunity, captaincy and eviction all operate from this board.</p></div><button class="toggle ${window.showEvicted?'on':''}" onclick="toggleEvictedView()"><i></i>${window.showEvicted?'Showing evicted':'Show evicted'}</button></section><div class="house-grid">${list.map(c=>contestantCard(c,b.findIndex(x=>x.id===c.id)+1)).join('')}</div></div>`}
function contestantCard(c,rank){return `<article class="card ${c.nominated?'nominated':''} ${c.status==='Evicted'?'evicted':''}"><div class="card-top"><span class="ranktag">#${rank>0?rank:'—'}</span><span class="statetag ${c.status.toLowerCase()}">${c.status}</span></div><button class="avatarbtn" onclick="openDrawer('${c.id}')">${avatar(c,'large')}</button><h4>${esc(c.name)}</h4><div class="team">${esc(c.team)} team</div><div class="score">${c.points} <small>PTS</small></div><div class="badges">${c.id===state.captainId?'<span class="badge captain">CAPTAIN</span>':''}${c.immune?'<span class="badge immune">IMMUNE</span>':''}${c.nominated?'<span class="badge nom">NOMINATED</span>':''}</div><div class="points-row"><button onclick="changePoints('${c.id}',-25)">−25</button><button onclick="changePoints('${c.id}',25)">+25</button></div><div class="card-actions"><button onclick="immunity('${c.id}')">${c.immune?'Remove immunity':'Grant immunity'}</button><button onclick="nomination('${c.id}')">${c.nominated?'Remove nomination':'Nominate'}</button><button onclick="makeCaptain('${c.id}')">Make captain</button>${c.status==='Active'?`<button onclick="evict('${c.id}')">Evict</button>`:''}</div></article>`}
function tasks(){return `<div class="stack"><section class="panel intro"><div><div class="kicker">TASK MANAGEMENT</div><h3>Assign work, track completion, award points.</h3><p>Every task has an assignee, deadline, reward and live status.</p></div><button class="primary" onclick="openTaskModal()">+ New task</button></section><section class="panel fulltask"><div class="tabs"><span class="tab active">All tasks</span><span class="tab">Open</span><span class="tab">Completed</span></div><div class="task headrow"><span>TASK</span><span>ASSIGNEE</span><span>DUE</span><span>REWARD</span><span>STATUS</span></div>${taskRows(true)}</section></div>`}
function danger(){const n=nominees();return `<div class="stack"><section class="danger-banner"><div><div class="kicker">EVICTION BOARD</div><h3>The Danger Zone</h3><p>These contestants are currently nominated. Immune contestants cannot enter this board.</p></div><div class="danger-count">${n.length}<small>NOMINEES</small></div></section><section class="panel"><div class="head"><div><div class="kicker">ACTIVE NOMINATIONS</div><h3>Who is at risk</h3></div><span class="pill">ROUND 7</span></div>${n.length?`<div class="danger-list">${n.map((c,i)=>`<div class="drow"><span class="dnum">0${i+1}</span>${avatar(c,'sm')}<div class="dinfo"><h4>${esc(c.name)}</h4><small>${esc(c.team)} · ${c.points} points</small></div><span class="dstate">NOMINATED</span><button class="btn" onclick="nomination('${c.id}')">Unnominate</button><button class="btn" onclick="immunity('${c.id}')">Grant immunity</button><button class="danger" onclick="evict('${c.id}')">Evict</button></div>`).join('')}</div>`:`<div class="empty"><strong>—</strong>The Danger Zone is clear.</div>`}</section></div>`}
function control(){const a=active(),cap=captain();return `<div class="stack"><div class="control-grid"><section class="panel"><div class="kicker">CAPTAINCY</div><h3>House Captain</h3><p>Current holder</p><div class="current">${cap?avatar(cap)+`<div><strong>${esc(cap.name)}</strong><small>${esc(cap.team)} · ${cap.points} pts</small></div>`:'No captain assigned'}</div><div class="captains">${a.map(c=>`<button class="${c.id===state.captainId?'selected':''}" onclick="makeCaptain('${c.id}')">${esc(c.name)}</button>`).join('')}</div></section><section class="panel timer"><div class="kicker">TASK TIMER</div><h3>Round clock</h3><div class="time" data-timer>${fmt(state.seconds)}</div><div class="actions"><button class="primary" onclick="timerToggle()">${state.running?'Pause':'Start'} timer</button><button class="btn" onclick="timerReset()">Reset</button></div></section></div><div class="control-grid"><section class="panel"><div class="kicker">BIG BOSS BROADCAST</div><h3>Make an announcement</h3><textarea id="controlAnnouncement" class="textarea" placeholder="Tell the House what happens next…"></textarea><button class="primary" onclick="sendControlAnnouncement()">Broadcast announcement</button>${state.announcements[0]?`<div class="last-broadcast"><small>LAST BROADCAST · ${esc(state.announcements[0].time)}</small><strong>${esc(state.announcements[0].text)}</strong></div>`:''}</section><section class="panel"><div class="kicker">POINT CONTROL</div><h3>Manual score adjustment</h3><div class="point-list">${a.map(c=>`<div class="p-row"><div><strong>${esc(c.name)}</strong><small>${c.points} pts</small></div><div class="pbuttons"><button onclick="changePoints('${c.id}',-25)">−25</button><button onclick="changePoints('${c.id}',25)">+25</button></div></div>`).join('')}</div></section></div><section class="panel demo-reset"><div><div class="kicker">DEMO CONTROL</div><h3>Restore the starting house</h3><p>Reset the browser's saved state so the next demo starts from the prepared scenario.</p></div><button class="danger" onclick="resetHouse()">Reset demo state</button></section></div>`}
function render(){document.getElementById('app').innerHTML=shell();const view=document.getElementById('view');view.innerHTML=({overview,house,tasks,danger,control})[section]();}
function sendAnnouncement(){const el=document.getElementById('announcement');if(el)broadcast(el.value)}
function sendControlAnnouncement(){const el=document.getElementById('controlAnnouncement');if(el)broadcast(el.value)}
function toggleEvictedView(){window.showEvicted=!window.showEvicted;setSection('house')}
function openTaskModal(){document.body.insertAdjacentHTML('beforeend',`<div class="modal-back" id="taskModal"><div class="modal"><div class="head"><div><div class="kicker">TASK CREATION</div><h3>Assign a new task</h3></div><button class="close" onclick="closeModal()">×</button></div><form onsubmit="addTask(event)"><label>Task name<input id="taskTitle" required placeholder="e.g. Living room reset"></label><label>Assignee<select id="taskAssignee">${active().map(c=>`<option>${esc(c.name)}</option>`).join('')}</select></label><label>Point reward<input id="taskPoints" type="number" min="0" value="50"></label><label>Due<input id="taskDue" value="Today · 18:00"></label><button class="primary" type="submit">Assign task</button></form></div></div>`)}
function closeModal(){document.getElementById('taskModal')?.remove()}
function addTask(e){e.preventDefault();const title=document.getElementById('taskTitle').value.trim();if(!title)return;state.tasks.unshift({id:'t'+Date.now(),title,assignee:document.getElementById('taskAssignee').value,due:document.getElementById('taskDue').value,status:'Pending',points:Number(document.getElementById('taskPoints').value)||0});persist();closeModal();render();flash('New task assigned.','success')}
function openDrawer(id){const c=state.contestants.find(x=>x.id===id);if(!c)return;document.body.insertAdjacentHTML('beforeend',`<div class="drawer-back" id="drawerBack"><aside class="drawer"><button class="close" onclick="closeDrawer()">×</button>${avatar(c)}<div class="kicker">CONTESTANT PROFILE</div><h3>${esc(c.name)}</h3><div class="meta">${esc(c.team)} team · ${c.status}</div><div class="profile-score"><span>Current score</span><strong>${c.points}</strong><small>POINTS</small></div><div class="badges">${c.nominated?'<span class="badge nom">NOMINATED</span>':''}${c.immune?'<span class="badge immune">IMMUNE</span>':''}${c.id===state.captainId?'<span class="badge captain">CAPTAIN</span>':''}</div><div class="profile-actions"><button onclick="immunity('${c.id}');closeDrawer()">${c.immune?'Remove immunity':'Grant immunity'}</button><button onclick="nomination('${c.id}');closeDrawer()">${c.nominated?'Remove nomination':'Nominate'}</button><button onclick="makeCaptain('${c.id}');closeDrawer()">Make captain</button>${c.status==='Active'?`<button class="danger" onclick="closeDrawer();evict('${c.id}')">Evict contestant</button>`:''}</div></aside></div>`)}
function closeDrawer(){document.getElementById('drawerBack')?.remove()}
render();
</script>
</body>
</html>
